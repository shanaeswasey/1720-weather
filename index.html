<!DOCTYPE html>
<html lang="en"> <!-- Sets the page language to English -->

<head> <!-- Holds page settings and links that are not shown as page content -->
    <meta charset="UTF-8"> <!-- Lets the page show letters, numbers, and symbols correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Helps the page fit correctly on phones, tablets, and computers -->
    <title>Shanae Swasey Weather | DWDD1720</title> <!-- Sets the name shown on the browser tab -->

    <!-- STYLESHEETS --> <!-- Connects the CSS files that control how the page looks -->
    <link rel="stylesheet" href="styles/normalize.css">
    <!-- Helps the page look more consistent in different browsers -->
    <link rel="stylesheet" href="styles/small.css"> <!-- Controls how the page looks on smaller screens -->
    <link rel="stylesheet" href="styles/larger.css"> <!-- Controls how the page changes on larger screens -->

    <!--GOOGLE FONT-->
    <!-- Connects the page to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Connects to the server that stores the font -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loads the Google font onto the page -->
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">


    <!--OPEN GRAPH TAGS--> <!-- Controls the title, description, and image shown when the website link is shared -->
    <!-- Sets the title shown when the website link is shared -->

    <!-- Sets the full URL for this webpage -->
    <meta property="og:url" content="https://shanaeswasey.github.io/1720-weather/">

    <!-- Tells social media that this is a website -->
    <meta property="og:type" content="website">

    <!-- Sets the title that appears when the page is shared -->
    <meta property="og:title" content="Shanae Swasey Weather | DWDD1720">

    <!-- Sets the description that appears when the page is shared -->
    <meta property="og:description" content="Practice Page for Shanae Swasey's DWDD1720 Weather Assignment.">

    <!-- Sets the image that appears when the page is shared -->
    <meta property="og:image" content="https://shanaeswasey.github.io/1720-weather/images/opengraph.jpg">

    <!-- Sets the logo used for the website -->
    <meta property="og:logo" content="https://shanaeswasey.github.io/1720-weather/images/logo.svg">

    <!-- Sets the name of the website -->
    <meta property="og:site_name" content="Weather">



    <!--FAV ICON LINKS--> <!-- Connects the favicon images used in the browser tab and on devices -->
    <!-- Uses a 96x96 PNG image as a favicon -->
    <link rel="icon" type="image/png" href="/1720-weather/favicon-96x96.png" sizes="96x96" />

    <!-- Uses the SVG version of the favicon -->
    <link rel="icon" type="image/svg+xml" href="/1720-weather/favicon.svg" />

    <!-- Uses the standard favicon file -->
    <link rel="shortcut icon" href="/1720-weather/favicon.ico" />

    <!-- Sets the icon used when the website is saved to an Apple device -->
    <link rel="apple-touch-icon" sizes="180x180" href="/1720-weather/apple-touch-icon.png" />

    <!-- Sets the website name shown when saved to an Apple device -->
    <meta name="apple-mobile-web-app-title" content="National Park Weather" />

    <!-- Connects the file that stores extra favicon information -->
    <link rel="manifest" href="/1720-weather/site.webmanifest" />



    <!--SCRIPTS--> <!-- Connects the JavaScript files that make parts of the page work -->
    <!-- Makes the hamburger navigation menu open and close -->
    <script src="scripts/navigation.js" defer></script>

    <!-- Automatically puts the current year in the footer -->
    <script src="scripts/year.js" defer></script>

    <!-- Changes the background image when a national park is selected -->
    <script src="scripts/background.js" type="module"></script>

    <!-- Gets the current weather information for the national parks -->
    <script src="scripts/getWeather.js" type="module"></script>

    <!--STARTS THE HEADER SECTION-->
</head> <!-- Ends the section that holds the page settings and linked files -->

<body> <!-- Starts everything that will actually show on the webpage -->
    <header>
        <!-- Shows the logo at the top of the page -->
        <img src="images/logo.svg" alt="National Park Weather Logo" width="138" height="50">


        <!-- Creates the hamburger button used to open the navigation menu -->
        <button id="hamburger" class="hamburger" aria-label="Nav Link Button"></button>
    </header>

    <!-- Starts the navigation menu -->
    <nav id="navbar">
        <ul> <!-- Starts the list of navigation links -->

            <!-- Shows the current page in the navigation -->
            <li class="active"><a href="index.html">Home</a></li>

            <!-- Link to the About Page -->
            <li><a href="#">About</a></li>

            <!-- Link to the National Park Service website -->
            <li><a href="https://www.nps.gov/" target="_blank">National Parks</a></li>

        </ul> <!-- Ends the list of navigation links -->
    </nav> <!-- Ends the navigation menu -->


    <!-- Starts the main content area of the page -->
    <main>
        <h1>National Park Weather</h1>

        <!-- Displays the selected national park's weather information -->
        <div id="weather"></div>
    </main>

    <!-- Holds the park buttons and footer together -->
    <div class="bottom-bar">


        <!-- Holds the four national park weather buttons -->
        <div class="park-buttons">
            <!-- Selects Zion National Park -->
            <button id="zion">Zion</button>

            <!-- Selects Yosemite National Park -->
            <button id="yosemite">Yosemite</button>

            <!-- Selects Glacier National Park -->
            <button id="glacier">Glacier</button>

            <!-- Selects Olympic National Park -->
            <button id="olympic">Olympic</button>
        </div>


        <!-- Starts the footer at the bottom of the page -->
        <footer>
            <!-- Holds the social media links -->
            <section class="social">

                <!-- Links to GitHub -->
                <a href="https://www.github.com" target="_blank"><img src="images/icon-github.svg" alt="GitHub Icon"
                        width="16" height="16"></a>

                <!-- Links to LinkedIn -->
                <a href="https://www.linkedin.com" target="_blank"><img src="images/icon-linkedin.svg"
                        alt="LinkedIn Icon" width="16" height="16"></a>

                <!-- Links to YouTube -->
                <a href="https://www.youtube.com" target="_blank"><img src="images/icon-youtube.svg" alt="Youtube Icon"
                        width="16" height="16"></a>

                <!-- Links to Facebook -->
                <a href="https://www.facebook.com" target="_blank"><img src="images/icon-facebook.svg"
                        alt="Facebook Icon" width="16" height="16"></a>
            </section> <!-- Ends the social media links -->

            <!-- Shows the current year, your name, and course name -->
            <p>&copy; <span id="currentyear"></span> &bull; Shanae Swasey &bull; DWDD1720</p>

        </footer><!-- Ends the footer -->
        </div> <!-- Ends the bottom bar containing the park buttons and footer -->
</body> <!-- Ends everything shown on the page -->

</html> <!-- Ends the entire HTML document -->
